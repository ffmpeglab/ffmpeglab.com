    <!--
      FFmpegLab Login Form — framework-free embed

      Copy the <section> into any page, then include the script once:
        <script src="/login-form-embed.js" defer></script>

      REQUIRED CONFIGURATION
        data-endpoint="https://your-secure-auth-endpoint.example/login"

      OPTIONAL CONFIGURATION
        data-submit-mode="json"          json | form (default: json)
        data-redirect-url="/account"     used if the response does not provide redirectUrl
        data-forgot-url="/forgot-password"
        data-signup-url="/signup"
        data-csrf-token="..."            sent as X-CSRF-Token and in the request body
        data-project-url-template="/projects/new?template={template}"
        data-xfade-url="/projects/new?template=xfade"
        data-amix-url="/projects/new?template=amix"
        data-gif-url="/projects/new?template=video-to-gif"

      Security requirements:
      - Serve only over HTTPS.
      - Authenticate and rate-limit on the server.
      - Set auth cookies server-side with HttpOnly, Secure, and SameSite.
      - Never put real credentials, API keys, or secrets in this HTML/JavaScript.
      - Replace the placeholder endpoint before using the form in production.
    -->

    <section
      data-ffmpeglab-login
      data-endpoint="{{login_endpoint}}"
      data-submit-mode="json"
      data-redirect-url="{{redirect_url}}"
      data-forgot-url="{{forgot_password_url}}"
      data-signup-url="{{signup_url}}"
      data-csrf-token="{{csrf_token}}"
      style="position:relative;display:flex;min-height:100vh;align-items:center;justify-content:center;overflow:hidden;padding:48px 20px;background:#f7f5fa;color:#211b3a;font-family:Arial,Helvetica,sans-serif;"
    >
      <div data-login-light="orange" aria-hidden="true" style="pointer-events:none;position:absolute;left:-120px;top:18%;width:360px;height:360px;border-radius:50%;background:rgba(252,109,38,0.42);filter:blur(78px);opacity:0.92;"></div>
      <div data-login-light="purple" aria-hidden="true" style="pointer-events:none;position:absolute;right:-110px;bottom:8%;width:340px;height:340px;border-radius:50%;background:rgba(116,78,197,0.34);filter:blur(78px);opacity:0.92;"></div>
      <div data-login-light="amber" aria-hidden="true" style="pointer-events:none;position:absolute;left:44%;bottom:-80px;width:220px;height:220px;border-radius:50%;background:rgba(252,211,77,0.34);filter:blur(65px);opacity:0.9;"></div>

      <div style="position:relative;width:100%;max-width:470px;">
        <div data-login-glass style="position:relative;overflow:hidden;padding:8px;border:1px solid rgba(255,255,255,0.78);border-radius:32px;background:rgba(255,255,255,0.60);box-shadow:0 34px 90px -34px rgba(33,27,58,0.48),inset 0 1px 0 rgba(255,255,255,0.9);backdrop-filter:blur(30px);-webkit-backdrop-filter:blur(30px);">
          <div style="position:relative;padding:34px 32px 32px 32px;border:1px solid rgba(255,255,255,0.58);border-radius:25px;background:rgba(255,255,255,0.38);">
  
            <div data-login-form-view>
              <div>
                <span style="display:inline-block;padding:8px 12px;border:1px solid rgba(255,255,255,0.9);border-radius:999px;background:rgba(255,255,255,0.70);box-shadow:0 3px 10px rgba(33,27,58,0.06);font-size:10px;font-weight:800;letter-spacing:1.2px;text-transform:uppercase;">✦&nbsp; Welcome back</span>
                <h1 style="margin:17px 0 0 0;color:#211b3a;font-size:38px;font-weight:800;line-height:1.08;letter-spacing:-1.3px;">Open your workspace.</h1>
              </div>

              <form data-login-form novalidate style="margin-top:27px;">
                <div>
                  <label for="login-embed-email" style="display:block;margin:0 0 8px 2px;color:#211b3a;font-size:12px;font-weight:750;letter-spacing:0.2px;">Email address</label>
                  <div style="position:relative;">
                    <span aria-hidden="true" style="pointer-events:none;position:absolute;left:15px;top:50%;margin-top:-10px;color:#867e92;font-size:18px;line-height:20px;">✉</span>
                    <input id="login-embed-email" data-login-email name="email" type="email" autocomplete="username" inputmode="email" required placeholder="you@example.com" style="box-sizing:border-box;width:100%;height:56px;padding:0 16px 0 45px;border:1px solid #ded9e6;border-radius:13px;background:rgba(255,255,255,0.86);color:#211b3a;font-family:Arial,Helvetica,sans-serif;font-size:15px;outline:none;box-shadow:inset 0 1px 0 rgba(255,255,255,0.9);" />
                  </div>
                  <div data-login-email-error hidden style="margin:7px 0 0 2px;color:#c53030;font-size:12px;font-weight:700;">Enter a valid email address.</div>
                </div>

                <div data-login-error hidden role="alert" style="margin-top:18px;padding:12px 14px;border:1px solid #efb2b2;border-radius:11px;background:rgba(254,226,226,0.84);color:#9b2c2c;font-size:13px;font-weight:700;line-height:1.45;">We couldn’t sign you in. Check your details and try again.</div>

                <button data-login-submit type="submit" style="display:flex;gap:10px;align-items: center;justify-content: center;width:100%;width:100%;height:56px;margin-top:20px;padding:0 20px;border:0;border-radius:13px;background:#211b3a;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:750;cursor:pointer;box-shadow:0 10px 22px rgba(33,27,58,0.25);">
                  <span>Sign in with Email</span></button>
                <button data-login-github style="display:flex;gap:10px;align-items: center;justify-content: center;width:100%;height:56px;margin-top:20px;padding:0 20px;border:0;border-radius:13px;background:black;color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:750;cursor:pointer;box-shadow:0 10px 22px rgba(33,27,58,0.25);">
<svg style="filter:invert()" width="30" height="30" viewBox="0 0 128 128" fill="none" xmlns="http://www.w3.org/2000/svg">
<path d="M56.7937 84.9688C44.4187 83.4688 35.7 74.5625 35.7 63.0313C35.7 58.3438 37.3875 53.2813 40.2 49.9063C38.9812 46.8125 39.1687 40.25 40.575 37.5313C44.325 37.0625 49.3875 39.0313 52.3875 41.75C55.95 40.625 59.7 40.0625 64.2937 40.0625C68.8875 40.0625 72.6375 40.625 76.0125 41.6563C78.9187 39.0313 84.075 37.0625 87.825 37.5313C89.1375 40.0625 89.325 46.625 88.1062 49.8125C91.1062 53.375 92.7 58.1563 92.7 63.0313C92.7 74.5625 83.9812 83.2813 71.4187 84.875C74.6062 86.9375 76.7625 91.4375 76.7625 96.5938L76.7625 106.344C76.7625 109.156 79.1062 110.75 81.9187 109.625C98.8875 103.156 112.2 86.1875 112.2 65.1875C112.2 38.6563 90.6375 17 64.1062 17C37.575 17 16.2 38.6562 16.2 65.1875C16.2 86 29.4187 103.25 47.2312 109.719C49.7625 110.656 52.2 108.969 52.2 106.438L52.2 98.9375C50.8875 99.5 49.2 99.875 47.7 99.875C41.5125 99.875 37.8562 96.5 35.2312 90.2188C34.2 87.6875 33.075 86.1875 30.9187 85.9063C29.7937 85.8125 29.4187 85.3438 29.4187 84.7813C29.4187 83.6563 31.2937 82.8125 33.1687 82.8125C35.8875 82.8125 38.2312 84.5 40.6687 87.9688C42.5437 90.6875 44.5125 91.9063 46.8562 91.9063C49.2 91.9063 50.7 91.0625 52.8562 88.9063C54.45 87.3125 55.6687 85.9063 56.7937 84.9688Z" fill="black"/>
</svg>
<span>Sign in with GitHub</span></button>
                <button data-login-google type="submit" style="display:flex;gap:10px;align-items: center;justify-content: center;width:100%;width:100%;height:56px;margin-top:20px;padding:0 20px;border:0;border-radius:13px;background:#fff;color:black;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:750;cursor:pointer;box-shadow:0 10px 22px rgba(33,27,58,0.25);">

<svg width="30px" height="30px" viewBox="-3 0 262 262" xmlns="http://www.w3.org/2000/svg" preserveAspectRatio="xMidYMid"><path d="M255.878 133.451c0-10.734-.871-18.567-2.756-26.69H130.55v48.448h71.947c-1.45 12.04-9.283 30.172-26.69 42.356l-.244 1.622 38.755 30.023 2.685.268c24.659-22.774 38.875-56.282 38.875-96.027" fill="#4285F4"/><path d="M130.55 261.1c35.248 0 64.839-11.605 86.453-31.622l-41.196-31.913c-11.024 7.688-25.82 13.055-45.257 13.055-34.523 0-63.824-22.773-74.269-54.25l-1.531.13-40.298 31.187-.527 1.465C35.393 231.798 79.49 261.1 130.55 261.1" fill="#34A853"/><path d="M56.281 156.37c-2.756-8.123-4.351-16.827-4.351-25.82 0-8.994 1.595-17.697 4.206-25.82l-.073-1.73L15.26 71.312l-1.335.635C5.077 89.644 0 109.517 0 130.55s5.077 40.905 13.925 58.602l42.356-32.782" fill="#FBBC05"/><path d="M130.55 50.479c24.514 0 41.05 10.589 50.479 19.438l36.844-35.974C195.245 12.91 165.798 0 130.55 0 79.49 0 35.393 29.301 13.925 71.947l42.211 32.783c10.59-31.477 39.891-54.251 74.414-54.251" fill="#EB4335"/></svg>
<span>Sign in with Google</span></button>

                <button data-skip style="display:flex;gap:10px;align-items: center;justify-content: center;width:100%;width:100%;height:56px;margin-top:20px;padding:0 20px;border:0;border-radius:13px;background:var(--orange);color:#ffffff;font-family:Arial,Helvetica,sans-serif;font-size:15px;font-weight:750;cursor:pointer;box-shadow:0 10px 22px rgba(33,27,58,0.25);">
                  <a href="https://webapp.ffmpeglab.com/webapp/editor/Editor" style="color:white;text-decoration: none;">Skip</a></button>
              </form>
            </div>

            <div data-login-success hidden style="padding:48px 12px 32px 12px;text-align:center;">
              <span style="display:inline-block;width:66px;height:66px;border-radius:50%;background:#ffd659;color:#211b3a;font-family:Arial,Helvetica,sans-serif;font-size:30px;font-weight:bold;line-height:66px;box-shadow:6px 6px 0 #211b3a;">✓</span>
              <h2 style="margin:25px 0 0 0;color:#211b3a;font-size:30px;font-weight:800;line-height:1.15;letter-spacing:-0.8px;">Check Your Email.</h2>
              <p style="margin:10px 0 0 0;color:#655d72;font-size:15px;line-height:1.6;">Login Using the Magic Link…</p>
            </div>
          </div>
        </div>

        <p style="margin:17px 0 0 0;color:#867e92;font-size:11px;line-height:1.6;text-align:center;">Use only on HTTPS pages connected to your secure authentication backend.</p>
      </div>
    </section>
